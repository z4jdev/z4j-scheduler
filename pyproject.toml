[project]
name = "z4j-scheduler"
version = "1.9.1"
description = "Engine-agnostic dynamic scheduler for the z4j stack (Apache 2.0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "z4j contributors" }]
keywords = [
    "z4j",
    "scheduler",
    "cron",
    "celery",
    "rq",
    "dramatiq",
    "task",
    "queue",
    "distributed",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    # Reuses z4j-core Pydantic models (Schedule, Command, Event,
    # error hierarchy) directly - no protobuf duplication inside
    # the Python codebase. Floor matches what the Schedule model
    # additions (catch_up, source, source_hash) ship at.
    # Audit fix CRIT-5 (1.2.2 seventh-pass): broaden upper bound
    # to ``<2`` so installs that pin z4j-core==1.2.2 (the wave
    # that introduced declarative reconciler + audit
    # api_key_id) don't fail/downgrade. z4j-scheduler doesn't
    # depend on any 1.2-specific API surface, so the broader
    # range is safe.
    "z4j-core>=1.9.1,<2",
    # Async HTTP server for /health, /ready, /metrics, /info.
    # Same FastAPI as z4j-brain so contributors carry over patterns.
    "fastapi>=0.135",
    "uvicorn[standard]>=0.32",
    # uvloop is installed only on non-Windows platforms; Windows
    # falls back to the default asyncio loop.
    "uvloop>=0.21; sys_platform != 'win32'",
    # gRPC server + client (brain <-> scheduler). Async API used
    # throughout. Stubs are committed in src/z4j_scheduler/proto/
    # so the toolchain is build-time only.
    # Floors must match the committed gencode: scheduler_pb2_grpc.py
    # hard-requires grpcio>=1.80.0 and scheduler_pb2.py rejects a protobuf
    # runtime older than its 6.31.1 gencode. The published protobuf floor is
    # 6.33.5 because that is the first advisory-fixed runtime; a lower floor
    # can resolve an unsafe install even though the generated code imports.
    "grpcio>=1.80.0",
    "protobuf>=6.33.5",
    # asyncpg directly for advisory locks. No SQLAlchemy at the
    # scheduler level - DB usage is narrow (lock + emergency read).
    "asyncpg>=0.30",
    # Validation + settings. z4j-core's dependency supplies the effective
    # Pydantic floor for the coordinated package set.
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    # Boundary D: the Brain validates every prepared successor using an
    # independent implementation.  These exact pins are the complete
    # cadence-affecting closure and intentionally match z4j.
    #
    # tzdata is IANA 2026c. 2026a computes fire times an hour wrong for seven
    # zones with future effect: Africa/Casablanca and Africa/El_Aaiun from
    # 2026-09-20, and America/Edmonton, America/Vancouver, America/Yellowknife,
    # Canada/Mountain and Canada/Pacific from 2026-11-01.
    #
    # A change to this closure changes the cadence runtime fingerprint, and the
    # rollback compatibility carrier must keep computing the same value or the
    # prepare-runtime-rollback ceremony cannot honestly restamp a cursor. The
    # carrier therefore carries this same tzdata, so the sealed rollback target
    # stays byte-equal to this closure. Published 1.8 is untouched: its own
    # bytes are unchanged and it is never asked to agree with this closure
    # except through that ceremony.
    #
    # Both distributions move together or the closure is not exact, and the
    # carrier moves with them or the rollback target is not reachable.
    "croniter==6.2.2",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    # Astronomical event computation for solar schedules
    # (sunrise / sunset / dawn / dusk / noon / midnight at a given
    # lat/lon). docs/SCHEDULER.md §5.1 lists solar in the v1 kind
    # surface. Pure Python, ~50KB, no native deps.
    "astral==3.2",
    # Pinned IANA tzdata so deployments are deterministic across
    # base images that may ship stale /usr/share/zoneinfo.
    "tzdata==2026.3",
    # Same logging stack as the rest of z4j - structured JSON in
    # prod, pretty console in dev.
    "structlog>=25.1",
    # Standard Prometheus exposition.
    "prometheus-client>=0.21",
    # Typer-driven CLI (z4j-scheduler serve, import, schedules ...).
    "typer>=0.13",
    # For migration importers that need to call brain's REST API
    # (vs the scheduler's own gRPC channel which is for hot-path
    # only). Same httpx as the rest of z4j.
    "httpx>=0.28",
]

[project.optional-dependencies]
# Importers from each source scheduler. Optional so users only
# install what they need - the celery-beat importer pulls in
# celery itself, which is heavyweight.
celery-import = ["celery>=5.6", "django-celery-beat>=2.7"]
rq-import = ["rq>=2.0", "rq-scheduler>=0.14"]
apscheduler-import = ["apscheduler[sqlalchemy]>=3.10,<4"]

[project.scripts]
z4j-scheduler = "z4j_scheduler.cli:main"

[project.urls]
Changelog = "https://github.com/z4jdev/z4j-scheduler/blob/main/CHANGELOG.md"
Documentation = "https://z4j.dev/scheduler"
Homepage = "https://z4j.com"
Issues = "https://github.com/z4jdev/z4j-scheduler/issues"
Source = "https://github.com/z4jdev/z4j-scheduler"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/z4j_scheduler"]

[tool.hatch.build.targets.sdist]
include = [
    "src/z4j_scheduler",
    "proto/*.proto",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
